name: Lint

on:
  push:
    branch: master
    paths:
      - '.github/workflows/typecheck.yml'
      - '**.py'
  pull_request:
    paths:
      - '.github/workflows/typecheck.yml'
      - '**.py'

jobs:
  ty:
    name: Ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - run: uv run ty check .
