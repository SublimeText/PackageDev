name: Lint

on:
  push:
    branch: master
    paths:
      - '.github/workflows/typecheck.yml'
      - '**.py'
  pull_request:
    paths:
      - '.github/workflows/typecheck.yml'
      - '**.py'

jobs:
  ty:
    name: Ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - run: uv run ty check .
