name: Lint

on:
  push:
    branch: master
    paths:
      - '.github/workflows/typecheck.yml'
      - '**.py'
  pull_request:
    paths:
      - '.github/workflows/typecheck.yml'
      - '**.py'

jobs:
  ty:
    name: Ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - run: uv run ty check .
