name: Lint

on:
  push:
    branch: master
    paths:
      - '.github/workflows/lint.yml'
      - '**.py'
  pull_request:
    paths:
      - '.github/workflows/lint.yml'
      - '**.py'

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - run: uv run ruff check .

  compile:
    name: Compile (Python 3.8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # `requires-python = ">=3.8"` in pyproject.toml, so make sure the
      # package still compiles against the oldest supported interpreter.
      - run: uv run --python 3.8 python -m compileall -q main.py plugins
